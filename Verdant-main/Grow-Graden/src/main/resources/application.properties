# Server Configuration (Honors Render $PORT, defaults to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=Online Gardening Community Platform

# Database Configuration: Embedded H2 with configurable file storage (ephemeral on free container restarts)
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/gardendb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at /h2-console, disabled from external access for security)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

