<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Account - Verdant')}">
</head>
<body>

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar('register')}"></nav>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-garden p-4 p-md-5 shadow-sm border-0">
                    <div class="text-center mb-4">
                        <div class="brand-icon-box mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.75rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-1">Join the Collective</h2>
                        <p class="text-muted small">Create your account to publish guides, ask questions, and track projects</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small d-flex align-items-center mb-4">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${errorMessage}">Registration error.</span>
                    </div>

                    <form th:action="@{/register}" th:object="${registerDto}" method="post">
                        <!-- CSRF Token automatically injected by Thymeleaf th:action -->
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="username" class="form-label small fw-semibold">Username <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{username}" placeholder="Unique handle, e.g. green_thumb" required autofocus>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <div class="col-12">
                                <label for="fullName" class="form-label small fw-semibold">Full Name / Botanical Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g. Maya Lin" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-12">
                                <label for="email" class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-12">
                                <label for="password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="col-12 pt-2">
                                <button type="submit" class="btn btn-garden-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-check2-circle me-1"></i> Complete Registration
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">Already a member? </span>
                        <a th:href="@{/login}" class="text-success fw-semibold small text-decoration-none">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
