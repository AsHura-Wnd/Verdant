<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page Not Found - Verdant')}">
</head>
<body>

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

    <main class="container my-5 text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card card-garden p-5">
                    <div class="mb-3">
                        <i class="bi bi-tree-fill text-success display-1"></i>
                    </div>
                    <h2 class="fw-bold text-dark mb-2">Oops! Leaf Lost in the Wind</h2>
                    <p class="text-secondary mb-4">
                        The gardening page, tip, or discussion you are looking for could not be found or has moved.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-garden-primary">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                        <a th:href="@{/tips}" class="btn btn-outline-secondary">
                            <i class="bi bi-lightbulb me-1"></i> Browse Tips
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
